[package]
name = "deckra-app"
version = "0.1.0"
description = "DECKRA Control Center"
authors = ["VelaSmart"]
edition = "2021"

[lib]
name = "deckra_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
