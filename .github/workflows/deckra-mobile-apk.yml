name: Build DECKRA Mobile APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'deckra-mobile/**'
      - 'deckra-bridge/**'
      - '.github/workflows/deckra-mobile-apk.yml'
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build debug APK
        run: gradle -p deckra-mobile -PdeckraVersionCode=${{ github.run_number }} -PdeckraVersionName=0.1.${{ github.run_number }} assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: deckra-mobile-debug-apk
          path: deckra-mobile/app/build/outputs/apk/debug/app-debug.apk

  bridge-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows Bridge
        run: dotnet publish deckra-bridge/DeckraBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/bridge
      - uses: actions/upload-artifact@v4
        with:
          name: deckra-bridge-windows-x64
          path: publish/bridge/DeckraBridge.exe

  publish-release:
    needs: [build, bridge-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK and Windows Bridge
        uses: actions/download-artifact@v4
        with:
          pattern: deckra-*
          path: release-assets
          merge-multiple: true
      - name: Prepare stable APK filename
        run: cp release-assets/app-debug.apk release-assets/deckra-mobile.apk
      - name: Publish latest DECKRA Mobile release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deckra-mobile-latest
          name: DECKRA Mobile build ${{ github.run_number }}
          body: |
            Atualização automática do DECKRA Mobile.
            versionCode=${{ github.run_number }}
            versionName=0.1.${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/deckra-mobile.apk
            release-assets/DeckraBridge.exe
