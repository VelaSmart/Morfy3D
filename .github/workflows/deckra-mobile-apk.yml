name: Build DECKRA Mobile APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'deckra-mobile/**'
      - '.github/workflows/deckra-mobile-apk.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle -p deckra-mobile assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: deckra-mobile-debug-apk
          path: deckra-mobile/app/build/outputs/apk/debug/app-debug.apk

  bridge-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows Bridge
        run: dotnet publish deckra-bridge/DeckraBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/bridge
      - uses: actions/upload-artifact@v4
        with:
          name: deckra-bridge-windows-x64
          path: publish/bridge/DeckraBridge.exe
